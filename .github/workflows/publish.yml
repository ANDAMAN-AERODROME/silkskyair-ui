name: Publish Package
on:
  push:
    branches: [main, staging, develop]
    paths: ['src/**', 'package.json', 'tsup.config.ts']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BRANCH_NAME: ${{ github.ref_name }}
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          cache: pnpm
      - name: Set unique version
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "$BRANCH_NAME" = "main" ]; then
            SUFFIX="$SHA"
          else
            SUFFIX="$BRANCH_NAME.$SHA"
          fi
          node -e "const p=require('./package.json'); p.version+='-'+process.argv[1]; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" "$SUFFIX"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Determine dist-tag
        id: tag
        run: |
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi
      - run: pnpm publish --no-git-checks --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
